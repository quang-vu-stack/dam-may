<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>VŨ CLOUD</title><link rel="stylesheet" href="/style.css"></head><body>
<section id="login" class="auth-page"><form id="loginForm" class="auth-card"><div class="bigicon">☁️</div><h1>VŨ CLOUD</h1><p>Kho lưu trữ cá nhân</p><label>Tài khoản<input id="username" value="admin" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Đăng nhập →</button><span class="error" id="loginError"></span></form></section>
<div id="app" hidden><aside class="sidebar"><div class="logo">☁️ VŨ CLOUD</div><div class="nav active">▣ &nbsp;Tệp của tôi</div><div class="nav">🔒 &nbsp;Lưu trữ riêng tư</div><div class="usage"><span id="quota">Đang đọc dung lượng...</span><div class="bar"><div id="fill"></div></div><small>Thông tin dung lượng toàn ổ cứng</small></div><button class="secondary logout">Đăng xuất</button></aside><main><div class="mobileNav"><strong>☁️ VŨ CLOUD</strong><button class="secondary logout">Thoát</button></div><header><div><h2>Tệp của tôi</h2><p class="muted">Ảnh, video và tài liệu trong một nơi</p></div><div class="topactions"><button id="folderBtn" class="secondary">+ Thư mục</button><label class="primary uploadbtn">↑ Tải lên<input id="fileInput" type="file" multiple hidden></label></div></header><section class="workspace"><nav id="crumbs" class="crumbs"></nav><div class="tools"><input id="search" type="search" placeholder="🔎 Tìm trong thư mục này"><span id="count" class="muted"></span></div><div id="drop" class="drop"><div id="files" class="files"></div><div id="empty" class="empty" hidden>📁<h3>Chưa có tệp nào</h3><p>Tạo thư mục hoặc tải lên để bắt đầu.</p></div></div><div id="progress" class="muted"></div></section></main></div><div id="toast" role="status"></div><script defer src="/app.js"></script></body></html>
